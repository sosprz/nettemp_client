# MQTT Message Parsing Rules
# Define how to parse different MQTT message formats from various IoT devices
#
# Each rule matches incoming MQTT messages by topic pattern and defines how to extract sensor readings
# Rules are evaluated in order - first matching rule is used
#
# NOTE ABOUT INTERVALS:
# MQTT→Cloud throttling is configured in `config.conf` (MQTT → Nettemp):
# - `mqtt.subscriber_default_interval_s` (default 60s)
# - `mqtt.topic_intervals` (per-topic overrides)
# The `interval:` fields in rules are kept for backwards compatibility but are not required for normal use.
#
# DEVICE FILTERING:
# Filter devices by subscribing to specific topics in config.conf:
#
#   mqtt:
#     subscribe_topics:
#       - 'home/TheengsGateway/BTtoMQTT/A4C138165B5D'  # Specific device
#       - 'home/TheengsGateway/BTtoMQTT/A4C138161122'  # Another device
#       - 'sensors/esp8266-01/#'                       # All sensors from ESP
#
# AUTODISCOVERY:
# Use interactive menu to discover and select devices:
#   python3 nettemp_config.py
#   → Configure MQTT Bridge → Autodiscover MQTT Devices
#   → Select devices with arrow keys and space bar
#   → Automatically updates subscribe_topics in config.conf

# Topics to always exclude (status/control messages)
exclude_topics:
  # NOTE: We no longer exclude `nettemp/#` by default.
  # If you run Nettemp Client in `mode: both` (publisher + subscriber) AND subscribe to `#`,
  # you may want to add `exclude_topics: [nettemp/#]` in `config.conf` to avoid receiving your own publishes.
  - "*/LWT"                        # Last Will Testament messages
  - "*/lwt"
  - "homeassistant/*/config"       # Home Assistant config messages
  - "homeassistant/*/*/config"
  - "*/status/LWT"                 # ESPEasy LWT

rules:
  # Nettemp standard JSON payload (recommended for custom devices / ESP32 firmware)
  # Topic: nettemp/<device_id>/<sensor_id>
  # Payload: {"device_id":"...","sensor_id":"...","value":22.5,"sensor_type":"temperature","name":"BME280 temp"}
  - name: "Nettemp Standard"
    enabled: true
    topic_pattern: "nettemp/*/*"
    format: json
    interval: 60                     # Forward readings every 60 seconds (1 minute)
    device_id_field: "device_id"
    sensor_id_field: "sensor_id"
    sensor_name_field: "name"        # Friendly name from payload
    readings_map:
      value:
        type_from_field: "sensor_type"

  # Theengs Gateway - Bluetooth to MQTT bridge
  # Supports 70+ BLE devices (Xiaomi, Govee, etc.)
  # Topic: home/TheengsGateway/BTtoMQTT/<MAC>
  # Topic: home/OMG_ESP32_BLE/BTtoMQTT/<MAC>
  # Payload: {"name": "ATC_165B5D", "id": "A4:C1:38:16:5B:5D", "type": "THB", "tempc": 20.5, "hum": 57, "batt": 88}
  #
  # SENSOR NAMING OPTIONS:
  # 1. Use device_id_field: "id" + name in readings_map → "temperature", "humidity", "battery"
  # 2. Use device_id_field: "name" + display_name_field: "name" → "ATC_165B5D temperature", "ATC_165B5D humidity"
  # 3. Use device_id_field: "id" + sensor_name_field: "name" → "ATC_165B5D", "ATC_165B5D", "ATC_165B5D"
  - name: "BTtoMQTT"
    enabled: true
    topic_pattern: "+/+/BTtoMQTT/#"
    format: json
    interval: 600                    # Forward readings every 600 seconds (10 minutes)
    device_id_field: "id"            # Group by MAC address (e.g., "A4C138165B5D")
    device_id_fallback: "name"       # Fallback to name if 'id' not present
    readings_map:
      tempc:
        type: "temperature"
        name: "temperature"          # Override sensor name (optional)
        unit: "°C"
      hum:
        type: "humidity"
        name: "humidity"             # Override sensor name (optional)
        unit: "%"
      batt:
        type: "battery"
        name: "battery"              # Override sensor name (optional)
        unit: "%"

  # ESPEasy - ESP8266/ESP32 firmware
  # Topic: <device>/<task>/<valuename>
  # Payload: numeric value (e.g., "22.5")
  # Example: ESP32_Easy_1/BMP280/temperature → 22.5
  - name: "ESPEasy"
    enabled: true
    topic_pattern: "*/*/*"
    format: value
    interval: 300                    # Forward readings every 300 seconds (5 minutes)
    skip_topics:
      - "*/status/*"
      - "*/lwt"
      - "*/LWT"
      - "*/status/LWT"
      - "*/control/*"
      - "*/cmd/*"
    skip_values:
      - "connected"
      - "disconnected"
      - "online"
      - "offline"
    device_id_from: topic            # Extract device from topic[0]
    sensor_id_format: "{device}_{task}_{valuename}"
    friendly_name_format: "{task} {valuename}"
    value_type_from: valuename       # Use valuename as sensor type

  # Tasmota - Popular ESP8266/ESP32 firmware
  # Topic: tele/<device>/SENSOR
  # Payload: {"Time":"2024-12-13T10:30:00","DS18B20":{"Temperature":22.5},"TempUnit":"C"}
  - name: "Tasmota Sensor"
    enabled: true
    topic_pattern: "tele/*/SENSOR"
    format: json
    interval: 300                    # Forward readings every 300 seconds (5 minutes)
    device_id_from: topic
    flatten_nested: true
    readings_map:
      Temperature:
        type: "temperature"
        unit_from_field: "TempUnit"
        unit_map:
          C: "°C"
          F: "°F"
      Humidity:
        type: "humidity"
        unit: "%"
      Pressure:
        type: "pressure"
        unit: "hPa"

  # Zigbee2MQTT - Zigbee to MQTT bridge
  # Topic: zigbee2mqtt/<device>
  # Payload: {"temperature":22.5,"humidity":45,"battery":100,"linkquality":120}
  - name: "Zigbee2MQTT"
    enabled: true
    topic_pattern: "zigbee2mqtt/*"
    format: json
    interval: 300                    # Forward readings every 300 seconds (5 minutes)
    skip_topics:
      - "zigbee2mqtt/bridge/*"
    device_id_from: topic
    readings_map:
      temperature:
        type: "temperature"
        unit: "°C"
      humidity:
        type: "humidity"
        unit: "%"
      pressure:
        type: "pressure"
        unit: "hPa"
      battery:
        type: "battery"
        unit: "%"
      linkquality:
        type: "linkquality"
        unit: ""

  # Shelly devices
  # Topic: shellies/<device>/sensor/<type>
  # Payload: numeric value
  - name: "Shelly"
    enabled: true
    topic_pattern: "shellies/*/sensor/*"
    format: value
    interval: 300                    # Forward readings every 300 seconds (5 minutes)
    device_id_from: topic
    sensor_id_format: "shelly_{device}_{type}"
    value_type_from: topic

  # Generic JSON format (catch-all for other JSON devices)
  - name: "Generic JSON"
    enabled: true
    topic_pattern: "*"
    format: json
    interval: 60                     # Forward readings every 60 seconds (1 minute)
    device_id_field: "device_id"
    device_id_fallback: "device"
    sensor_id_field: "sensor_id"
    sensor_id_fallback: "sensor"
    readings_map:
      value:
        type_from_field: "type"
        unit_from_field: "unit"
      temperature:
        type: "temperature"
        unit: "°C"
      humidity:
        type: "humidity"
        unit: "%"

  # Simple value (last resort fallback)
  # Topic: any/topic/structure
  # Payload: numeric value
  - name: "Simple Value"
    enabled: true
    topic_pattern: "*"
    format: value
    interval: 60                     # Forward readings every 60 seconds (1 minute)
    device_id_from: topic
    sensor_id_format: topic_full
    value_type: "value"

# ============================================================
# RULE CONFIGURATION REFERENCE
# ============================================================
# Use these fields when creating rules for new sensors:

# RULE BASICS:
# - name: "Rule Name"                 # Display name for the rule
# - enabled: true/false               # Enable or disable this rule
# - topic_pattern: "sensor/+/data"    # MQTT topic pattern (* = any level, + = single level, # = all remaining)
# - format: json/value                # Message format (json for objects, value for plain numbers/strings)
# - interval: 300                     # Forward interval in seconds (rate limiting)

# DEVICE IDENTIFICATION:
# - device_id_field: "device_id"      # JSON field to use as device ID (e.g., "name", "id", "mac")
# - device_id_fallback: "id"          # Fallback field if primary is missing
# - device_id_from: topic             # Extract device ID from topic (instead of JSON)

# SENSOR NAMING (choose one strategy):
# Strategy 1: Override each reading name
#   readings_map:
#     temp: {type: "temperature", name: "temperature", unit: "°C"}
#   Result: Sensor name = "temperature"
#
# Strategy 2: Use JSON field as complete name
#   sensor_name_field: "name"         # Use this JSON field as sensor name
#   Result: Sensor name = value of "name" field (e.g., "ATC_165B5D")
#
# Strategy 3: Prefix with device name
#   display_name_field: "name"        # Prefix sensor names with this JSON field
#   Result: Sensor name = "ATC_165B5D temperature"
#
# Strategy 4: Just sensor type (default)
#   (no naming fields)
#   Result: Sensor name = "temperature"

# SENSOR ID FORMATTING:
# - sensor_id_format: "{device}_{task}_{valuename}"  # Template for sensor IDs
# - sensor_id_format: topic_full      # Use full topic as sensor ID (replace / with _)
# - sensor_id_field: "sensor_id"      # Use specific JSON field as sensor ID

# FRIENDLY NAMES:
# - friendly_name_format: "{task} {valuename}"  # Template for display names
#   Available placeholders: {device}, {task}, {valuename}, {type}, {object_id}

# READINGS MAP (for JSON format):
# readings_map:
#   field_name:                       # JSON field name (e.g., "tempc", "Temperature")
#     type: "temperature"             # Sensor type (temperature, humidity, pressure, etc.)
#     name: "temperature"             # Override sensor name (optional)
#     unit: "°C"                      # Unit for this reading
#     type_from_field: "type"         # Get type from another JSON field
#     unit_from_field: "unit"         # Get unit from another JSON field
#     unit_map:                       # Map unit field values to display units
#       C: "°C"
#       F: "°F"
#     value_map:                      # Map specific values (e.g., ON/OFF to 1/0)
#       "ON": 1
#       "OFF": 0
#       true: 1
#       false: 0

# VALUE FORMAT (for simple numeric payloads):
# - value_type: "temperature"         # Sensor type for simple values
# - value_type_from: valuename        # Extract type from topic part
#   Options: valuename (topic[2]), component (topic[1]), topic (last part)

# TOPIC FILTERING:
# - skip_topics:                      # Skip these topic patterns
#     - "*/status/*"
#     - "*/LWT"
# - skip_values:                      # Skip these payload values
#     - "connected"
#     - "offline"

# JSON PROCESSING:
# - flatten_nested: true              # Flatten nested JSON ({"BME280":{"Temperature":22}} → Temperature: 22)

# COMMON SENSOR TYPES:
# - temperature, humidity, pressure, battery, voltage, current, power
# - light, lux, motion, contact, occupancy, distance
# - rssi, linkquality, cpu, memory, disk
# - dewpoint, heatindex, gas, co2, tvoc, pm25, pm10
# - soil_moisture, water_level, rainfall
# - energy, frequency, power_factor

