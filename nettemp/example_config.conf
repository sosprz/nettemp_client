# ============================================================
# Nettemp Client Configuration
# ============================================================
# EASY SETUP: Run "python3 nettemp_config.py" for interactive
# configuration with automatic validation and testing.
#
# This file can also be edited manually if needed.
# ============================================================

# group / device name
group: living-room-1

# Local server (optional)
server: http://192.168.1.100:8080/
server_api_key: local_key_123

# ============================================================
# CLOUD SERVERS CONFIGURATION
# ============================================================
# RECOMMENDED: Use "python3 nettemp_config.py" to configure
# servers interactively with format detection and SSL settings.
#
# You can configure multiple cloud servers in two ways:
#
# OPTION 1: Multiple cloud servers (NEW FORMAT - RECOMMENDED)
# Sends data to all enabled servers simultaneously
# ============================================================
cloud_servers:
  - name: Production Server
    url: https://api.nettemp.pl
    api_key: ntk_production_key_here
    enabled: false
    format: cloud         # 'cloud' or 'legacy' (default: cloud)
    verify_ssl: true      # true or false (default: true)

  - name: Docker/Local Server
    url: https://nettemp.local
    api_key: custom_key_here
    enabled: false
    format: legacy        # Use legacy format for docker/old servers
    verify_ssl: false     # Disable SSL verification for self-signed certs

# ============================================================
# OPTION 2: Single cloud server (OLD FORMAT - BACKWARD COMPATIBLE)
# Only use this if you have a single cloud server
# ============================================================
#cloud_server: https://api.nettemp.pl/
#cloud_api_key: ntk_your_token_here
#cloud_enabled: true

# NOTE: If both formats are present, cloud_servers will be used first,
# then cloud_server will be added as an additional server if enabled.

# ============================================================
# OPTIONAL HTTP BRIDGE
# Accept HTTP on LAN and forward to cloud over HTTPS using the
# configured API keys. Useful when local devices cannot speak TLS.
# ============================================================
# http_bridge:
#   enabled: true
#   host: 0.0.0.0
#   port: 8080
#   auth_token: local_shared_secret

# ============================================================
# THEENGS GATEWAY (BLE to MQTT Bridge)
# ============================================================
# Theengs Gateway scans for Bluetooth Low Energy devices and
# forwards their data to MQTT broker. Great for Xiaomi sensors.
# RECOMMENDED: Use "python3 nettemp_config.py" to configure.
# ============================================================
theengs_gateway:
  enabled: false
  mqtt_host: 127.0.0.1
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_pass: ""
  adapter: hci0                              # Bluetooth adapter (hci0, hci1, etc)
  ble: 1                                     # Enable BLE scanning (1=yes, 0=no)
  ble_scan_time: 10                          # Scan duration in seconds
  ble_time_between_scans: 30                 # Wait time between scans
  scanning_mode: passive                     # passive or active
  publish_topic: home/TheengsGateway/BTtoMQTT  # Where Theengs publishes to
  publish_all: 1                             # Publish all devices (1=yes, 0=no)
  discovery: 0                               # Home Assistant autodiscovery (1=yes, 0=no)
  log_level: INFO                            # DEBUG, INFO, WARNING, ERROR
