[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "nettemp",
  "nettemp.mqtt",
  "nettemp.drivers",
]
include-package-data = true

[tool.setuptools.package-data]
"nettemp" = [
  "example_drivers_config.yaml",
  "example_config.conf",
  "example_mqtt_rules.yaml",
  "requirements.txt",
  "mqtt/example_mqtt_config.yaml"
]

[project]
name = "nettemp"
version = "0.1.0"
description = "Nettemp client and configurator CLI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.28.0",
  "pyyaml>=6.0",
  "psutil>=5.9.0",
  "apscheduler>=3.10.0",
  "paho-mqtt>=1.6.1",
  "pingparsing",
  "deepdiff",
  "w1thermsensor",
  "smbus",
  "smbus2",
  "gpiozero",
  "adafruit-circuitpython-htu21d",
  "adafruit-circuitpython-tsl2561",
  "Adafruit-BMP",
  "adafruit-circuitpython-adxl34x",
  "adafruit-circuitpython-dht",
  "adafruit-circuitpython-vl53l0x",
  "adafruit-circuitpython-ble",
  "adafruit-circuitpython-ble-lywsd03mmc",
  "TheengsGateway",
  "pymodbus==2.5.3",
  "sdm-modbus==0.5.0",
  "RPi.GPIO",
  "vcgencmd",
]

[project.scripts]
nettemp-config = "nettemp.nettemp_config:main"
nettemp-client = "nettemp.nettemp_client:main"
nettemp = "nettemp.nettemp_cli:main"
